# SD Core Solo for Windows: this file names NO PATH.  SDSYS, USRDIR and GRPDIR
# default to <home>\sdsys, <home>\user_accounts and <home>\group_accounts,
# where <home> is the folder two above the running sd-solo.exe's usr\bin
# (gplsrc/inipath.c GetHomePath).  A line here still overrides.
#
# THIS FILE IS NOT THE ONE THAT SHIPS.  The installed sd.conf is written by
# gplbld/stage.py from its SD_CONF string (which also says APIPORT, NETDIRS
# and the rest); this copy shows its plain settings and nothing reads it.  (18 Nov 26, four-version audit round 2: brought into
# step with SD_CONF and with Linux Solo's copy; it held the Linux development
# path /usr/local/sdsys and SD Core's ProgramData directories.)
[sd]
SCREENTHEME=paper
GRPSIZE=4
NUMUSERS=20
SORTMEM=4096
ERRLOG=50
SH=C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -NoLogo
SH1=C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
